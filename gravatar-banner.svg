  <rect width="640" height="144" fill="#F7F9FD"/>

  <!-- The LinkedIn banner's wave and sun, scaled to the 144-unit height.
       Gravatar puts the avatar over the left 200 units, so the sun sits
       to its right. The wave ends at the next crest, which leaves the
       right edge clear for the tag line. -->
  <g transform="translate(-125 0) scale(0.754)">
    <g clip-path="url(#sun-above-wave)">
      <circle cx="504.17" cy="139.9" r="70.3" fill="#F5A623"/>
    </g>
    <path d="M-112 28.5 C-41.985 28.5 -17.76 162.5 93.39 162.5 S228.765 28.5 298.78 28.5 C368.795 28.5 393.02 162.5 504.17 162.5 S639.545 28.5 709.56 28.5"
          fill="none" stroke="#102D75" stroke-linecap="round" stroke-width="22"/>
  </g>

  <text x="620" y="104" fill="#102D75" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700">Home energy, on your terms.</text>
  <text x="620" y="125" fill="#40557F" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="500">Whole-home energy, quietly coordinated.</text>
