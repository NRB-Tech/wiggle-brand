<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="144" viewBox="0 0 640 144">
  <defs>
    <clipPath id="sun-above-wave">
      <path d="M-112 28.5 C-41.985 28.5 -17.76 162.5 93.39 162.5 S228.765 28.5 298.78 28.5 C368.795 28.5 393.02 162.5 504.17 162.5 S639.545 28.5 709.56 28.5 C779.575 28.5 803.8 162.5 914.95 162.5 S1050.325 28.5 1120.34 28.5 C1190.355 28.5 1214.58 162.5 1325.73 162.5 L1325.73 0 L-112 0 Z"/>
