      <path d="M154 700C210 610 270 320 370 320C470 320 475 700 585 700C675 700 705 550 760 550C815 550 835 630 870 700V220H154Z"/>
    </clipPath>
  </defs>
  <rect x="114" y="112" width="796" height="796" fill="#FFFFFF"/>
  <circle cx="554" cy="630" r="150" fill="#F5A623" clip-path="url(#sun-clip)"/>
  <path d="M154 700C210 610 270 320 370 320C470 320 475 700 585 700C675 700 705 550 760 550C815 550 835 630 870 700" fill="none" stroke="#102D75" stroke-linecap="round" stroke-linejoin="round" stroke-width="80"/>
</svg>
