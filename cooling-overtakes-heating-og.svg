<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A home with a radiator heat pump on its winter side and an air conditioner on its summer side</title>
  <desc>Cut-away home with two rooms. On the left, under a snowflake and falling snow, a heat pump outside warms a radiator. On the right, under the sun, a wall-mounted air conditioner blows cool air over a sofa, with its outdoor unit on the wall. Navy, white, amber and cool blue; no logo or text.</desc>
  <defs>
    <!-- soft sky glows behind the snowflake and the sun -->
    <radialGradient id="winter-sky-glow" cx="230" cy="190" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CC0FF" stop-opacity="0.18"/>
      <stop offset="52%" stop-color="#7CC0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7CC0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="summer-sky-glow" cx="970" cy="190" r="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDB005" stop-opacity="0.26"/>
      <stop offset="42%" stop-color="#FF9E1B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FDB005" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-halo" cx="970" cy="190" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDB005" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#FDB005" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FDB005" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#01204C"/>
  <circle cx="230" cy="190" r="260" fill="url(#winter-sky-glow)"/>
  <circle cx="970" cy="190" r="285" fill="url(#summer-sky-glow)"/>
  <circle cx="970" cy="190" r="96" fill="url(#sun-halo)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M80,528 L1120,528"/>

    <!-- house: chimney, roof, walls and the wall between the two rooms -->
    <path d="M450,212 L450,158 L484,158 L484,188 M444,158 L490,158"/>
    <path d="M370,270 L600,104 L830,270 Z"/>
    <path d="M400,270 L400,528 M800,270 L800,528"/>
    <path d="M600,270 L600,528"/>

    <!-- loft window -->
    <circle cx="600" cy="206" r="22"/>
    <path d="M600,184 L600,228 M578,206 L622,206" stroke-width="3"/>

    <!-- winter room: window and radiator -->
    <rect x="465" y="296" width="70" height="76" rx="3"/>
    <path d="M500,296 L500,372 M465,334 L535,334" stroke-width="3"/>
    <rect x="444" y="440" width="112" height="62" rx="6"/>
    <path d="M460,447 L460,495 M476,447 L476,495 M492,447 L492,495 M508,447 L508,495 M524,447 L524,495 M540,447 L540,495" stroke-width="3"/>
    <path d="M458,502 L458,528 M542,502 L542,528"/>

    <!-- heat pump outside the winter room -->
    <g transform="translate(40,0)">
    <rect x="170" y="430" width="160" height="90" rx="10"/>
    <circle cx="218" cy="475" r="30"/>
    <circle cx="218" cy="475" r="5" stroke-width="3"/>
    <path d="M218,470 Q207,459 216,448 M223,475 Q234,464 245,473 M218,480 Q229,491 220,502 M213,475 Q202,486 191,477" stroke-width="3"/>
    <path d="M264,459 L306,459 M264,475 L306,475 M264,491 L306,491"/>
    <path d="M186,520 L186,528 M314,520 L314,528"/>
    </g>

    <!-- summer room: air conditioner on the wall and a sofa -->
    <rect x="634" y="302" width="132" height="44" rx="13"/>
    <path d="M650,334 L750,334" stroke-width="3"/>
    <path d="M640,516 L640,478 Q640,466 652,466 Q664,466 664,478 L664,490 L736,490 L736,478 Q736,466 748,466 Q760,466 760,478 L760,516 Z"/>
    <path d="M664,474 L664,452 Q664,440 676,440 L724,440 Q736,440 736,452 L736,474"/>
    <path d="M650,516 L650,528 M750,516 L750,528"/>

    <!-- its outdoor unit on a wall bracket -->
    <g transform="translate(-40,0)">
    <rect x="862" y="382" width="118" height="70" rx="8"/>
    <circle cx="897" cy="417" r="22" stroke-width="3"/>
    <circle cx="897" cy="417" r="4" stroke-width="2.5"/>
    <path d="M931,404 L964,404 M931,417 L964,417 M931,430 L964,430"/>
    <path d="M840,456 L972,456 M840,498 L904,456"/>
    </g>
  </g>

  <!-- heat from the heat pump to the radiator, and warmth rising from it -->
  <g fill="none" stroke="#FDB005" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370,484 L444,484"/>
    <path d="M472,428 Q462,418 472,408 Q482,398 472,392"/>
    <path d="M500,428 Q490,418 500,408 Q510,398 500,392"/>
    <path d="M528,428 Q518,418 528,408 Q538,398 528,392"/>
  </g>

  <!-- the pipe to the outdoor unit, and cool air from the air conditioner -->
  <g fill="none" stroke="#7CC0FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M766,324 L832,324 Q844,324 844,336 L844,382"/>
    <path d="M662,360 Q652,373 662,386 Q672,399 662,412"/>
    <path d="M700,360 Q690,373 700,386 Q710,399 700,412"/>
    <path d="M738,360 Q728,373 738,386 Q748,399 738,412"/>
  </g>

  <!-- winter: a snowflake and falling snow -->
  <g transform="translate(230,190)" fill="none" stroke="#7CC0FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-52 L0,52"/>
    <path d="M-45,-26 L45,26"/>
    <path d="M-45,26 L45,-26"/>
    <path d="M-12,-40 L0,-28 L12,-40 M-12,40 L0,28 L12,40"/>
    <path d="M-41,-10 L-24,-14 L-29,-31 M41,10 L24,14 L29,31"/>
    <path d="M-41,10 L-24,14 L-29,31 M41,-10 L24,-14 L29,-31"/>
  </g>
  <g fill="#7CC0FF">
    <circle cx="112" cy="120" r="4"/>
    <circle cx="318" cy="104" r="3.5"/>
    <circle cx="96" cy="290" r="3.5"/>
    <circle cx="330" cy="236" r="4"/>
    <circle cx="150" cy="352" r="3"/>
    <circle cx="262" cy="330" r="3.5"/>
    <circle cx="412" cy="118" r="3"/>
  </g>

  <!-- summer: the sun -->
  <g transform="translate(970,190)">
    <circle r="39" fill="#FDB005"/>
    <!-- six long rays -->
    <g stroke="#FDB005" stroke-width="4.75" stroke-linecap="round">
      <path d="M0,-52 L0,-74"/>
      <path d="M0,-52 L0,-74" transform="rotate(60)"/>
      <path d="M0,-52 L0,-74" transform="rotate(120)"/>
      <path d="M0,-52 L0,-74" transform="rotate(180)"/>
      <path d="M0,-52 L0,-74" transform="rotate(240)"/>
      <path d="M0,-52 L0,-74" transform="rotate(300)"/>
    </g>
    <!-- six short rays between them -->
    <g stroke="#FDB005" stroke-width="3.5" stroke-linecap="round" opacity="0.82">
      <path d="M0,-52 L0,-64" transform="rotate(30)"/>
      <path d="M0,-52 L0,-64" transform="rotate(90)"/>
      <path d="M0,-52 L0,-64" transform="rotate(150)"/>
      <path d="M0,-52 L0,-64" transform="rotate(210)"/>
      <path d="M0,-52 L0,-64" transform="rotate(270)"/>
      <path d="M0,-52 L0,-64" transform="rotate(330)"/>
    </g>
  </g>
</svg>
