<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiggle logo animation</title>
<style>
  :root { --bg: #FFFFFF; --line: #102D75; --sun: #F5A623; --hint: #6B7690; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1533; --line: #EAF0FF; --sun: #FFB743; --hint: #8E9AC0; }
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg { width: min(60vmin, 520px); height: auto; overflow: visible; cursor: pointer; margin-bottom: 8vmin; }
  form { display: grid; grid-template-columns: auto minmax(120px, 260px) 3.5em; gap: 6px 12px; align-items: center;
         font: 14px -apple-system, system-ui, sans-serif; color: var(--hint); padding: 0 16px 16px; }
  form > button { grid-column: 1 / -1; justify-self: center; font: inherit; padding: 6px 18px; margin-top: 6px; }
  .steps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .steps button { font: inherit; padding: 6px 12px; }
  #playback { min-width: 5em; }
  output { font-variant-numeric: tabular-nums; }
  #line { fill: none; stroke: var(--line); stroke-width: 32; stroke-linecap: round; stroke-linejoin: round; }
  #sun { fill: var(--sun); }
  .letter { fill: var(--line); }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" role="img" aria-label="Wiggle symbol">
  <defs><clipPath id="sun-clip"><path id="clip"/></clipPath></defs>

  <path id="line"/>

    <path class="letter" d="M575.29,691.11c7.08,7.85,15.78,11.78,26.1,11.78,24.02,0,36.04-14.17,36.04-42.5v-7.85c-2.77,6.32-7.62,11.24-14.55,14.78s-14.25,5.31-21.95,5.31c-15.09,0-27.95-5.16-38.58-15.48-10.63-10.32-15.94-23.79-15.94-40.42s5.31-30.41,15.94-40.89c10.63-10.47,23.48-15.71,38.58-15.71,7.54,0,14.71,1.62,21.48,4.85,6.77,3.23,11.78,7.7,15.01,13.4v-5.08c0-3.23,1.12-6.04,3.35-8.43,2.23-2.39,4.97-3.58,8.2-3.58s6.27,1.2,8.66,3.58c2.39,2.39,3.58,5.2,3.58,8.43l-.23,82c-.16,46.51-20.02,69.76-59.6,69.76-17.87,0-32.42-6.93-43.66-20.79-1.85-2.46-2.62-5.24-2.31-8.32.31-3.08,1.69-5.47,4.16-7.16,2.62-1.7,5.35-2.31,8.2-1.85,2.85.46,5.35,1.85,7.51,4.16ZM636.97,616.5c0-10.32-3.2-18.44-9.59-24.37-6.39-5.93-14.29-8.89-23.68-8.89s-17.02,3.12-23.33,9.36c-6.32,6.24-9.47,14.21-9.47,23.91s3.15,17.87,9.47,24.02c6.31,6.16,14.09,9.24,23.33,9.24,8.62,0,16.32-3.04,23.1-9.12,6.78-6.08,10.16-14.13,10.16-24.14Z"/>
    <path class="letter" d="M717.59,514.62v144.84c0,3.23-1.2,6.05-3.58,8.43s-5.28,3.58-8.66,3.58-5.97-1.19-8.2-3.58c-2.23-2.39-3.35-5.2-3.35-8.43v-144.84c0-3.23,1.12-6.04,3.35-8.43,2.23-2.39,4.97-3.58,8.2-3.58s6.27,1.19,8.66,3.58c2.39,2.39,3.58,5.2,3.58,8.43Z"/>
    <path class="letter" d="M853.42,613.96c0,3.08-1.08,5.66-3.23,7.74-2.16,2.08-4.7,3.12-7.62,3.12h-75.08c1.08,8.32,4.66,14.9,10.74,19.75,6.08,4.85,13.51,7.28,22.29,7.28,5.23,0,9.74-.84,13.51-2.54,3.77-1.69,7.81-4.31,12.13-7.85,2.16-1.85,4.58-2.92,7.28-3.23,2.69-.31,5.35.46,7.97,2.31,2.15,1.7,3.27,4.08,3.35,7.16.08,3.08-.89,5.7-2.89,7.85-10.94,11.4-25.1,17.09-42.5,17.09-15.71,0-28.88-5.23-39.5-15.71-10.63-10.47-15.94-24.1-15.94-40.89s5.31-30.3,15.94-40.54c10.63-10.24,23.79-15.36,39.5-15.36s27.95,4.89,38.12,14.67c10.16,9.78,15.48,22.83,15.94,39.15ZM767.48,607.49h62.6c-1.08-8.32-4.43-14.82-10.05-19.52-5.62-4.7-12.51-7.05-20.67-7.05s-15.63,2.39-21.48,7.16c-5.85,4.78-9.32,11.24-10.39,19.4Z"/>
  </g>
</svg>
<!-- Playback: these controls change how the page shows the animation, not the motion. -->
<form id="transport">
  <label for="time">Time (s)</label><input id="time" type="range" min="0" max="2.9" step="0.01" value="0"><output for="time"></output>
  <label for="speed">Speed (x)</label><input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"><output for="speed"></output>
  <div class="steps">
    <button type="button" id="to-start">Start</button>
    <button type="button" id="back">&minus;1 frame</button>
    <button type="button" id="playback">Pause</button>
    <button type="button" id="forward">+1 frame</button>
    <button type="button" id="to-end">End</button>
  </div>
</form>
<form id="controls">
  <label for="travel">Roll time (s)</label><input id="travel" type="range" min="1" max="2.5" step="0.05" value="1.5"><output for="travel"></output>
  <label for="ride">Sun ride to the left</label><input id="ride" type="range" min="40" max="300" step="5" value="130"><output for="ride"></output>
  <label for="lift">Arc height</label><input id="lift" type="range" min="250" max="600" step="10" value="430"><output for="lift"></output>
  <label for="sine">Sine wave quantity</label><input id="sine" type="range" min="0" max="1" step="0.05" value="0.9"><output for="sine"></output>
  <label for="flick">Flick height</label><input id="flick" type="range" min="0" max="90" step="2" value="20"><output for="flick"></output>
  <label for="word">Name starts (s)</label><input id="word" type="range" min="0" max="2" step="0.05" value="1.4"><output for="word"></output>
  <label for="pause">Pause before the end (s)</label><input id="pause" type="range" min="0" max="1.5" step="0.05" value="0.6"><output for="pause"></output>
  <label for="bounce">Bounce height</label><input id="bounce" type="range" min="0" max="60" step="2" value="26"><output for="bounce"></output>
  <button type="button" id="replay">Replay</button>
</form>
<script>
// Geometry of wiggle-symbol.svg: four cubic segments on the baseline y = 700.
const SEGMENTS = [
  [[154, 700], [210, 610], [270, 320], [370, 320]],
  [[370, 320], [470, 320], [475, 700], [585, 700]],
  [[585, 700], [675, 700], [705, 550], [760, 550]],
  [[760, 550], [815, 550], [835, 630], [870, 700]],
];
const X0 = 154, X1 = 870, WIDTH = X1 - X0, BASE = 700;
const SUN = { x: 554, y: 642, r: 114 };

// The first frame is the logo at rest, because a launch screen shows the static logo.
// The line then moves to the left through one full period, as a sine wave does, and
// what goes out at the left comes in at the right. A period is the logo and then a
// smooth trough that connects the right end of the logo to its left end, so the
// line has no sharp turn where the two ends meet. The trough of the logo moves the
// sun to the left with it. The large peak comes back in at the right and continues
// to roll. The sun pops up, goes over the large peak, and lands in the trough when
// the logo shape is back.
const query = new URLSearchParams(location.search);
// The controls on the page set these values. The defaults are the agreed motion.
const control = id => document.getElementById(id);
for (const id of ['travel', 'ride', 'lift', 'sine', 'flick', 'word', 'pause', 'bounce']) {
  if (query.has(id)) control(id).value = query.get(id);
}
let TRAVEL_TIME;                            // the line moves through one full width
let SUN_RIDE;                               // how far the trough moves the sun before the sun leaves it
let SUN_LAND, BOUNCE_END, DURATION;
// The name comes in letter by letter below the symbol. After a pause, the whole overlay goes away.
let WORD_START, WORD_END, PAUSE, AWAY_START;
const LETTER_TIME = 0.35, LETTER_STAGGER = 0.05, LETTER_RISE = 34, AWAY_TIME = 0.3;
let SUN_APEX_LIFT, BOUNCE_LIFT;
let FLICK_LIFT;                             // how far the line lifts below the sun to flick it up
let SINE_BLEND;                             // how much the moving line becomes a sine wave
const SINE_HEIGHT = 265;
// Set by configure(): when and where the sun leaves the trough.
let SUN_LAUNCH, FLIGHT_TIME, LAUNCH, LAUNCH_SPEED;

// Sample the logo as a height above the baseline on N points. The two ends are on the
// baseline, so the shape can repeat.
const N = 257;
const xs = Array.from({ length: N }, (_, i) => X0 + WIDTH * i / (N - 1));
const logo = (() => {
  const pts = [];
  for (const [a, b, c, d] of SEGMENTS) {
    for (let i = 0; i <= 400; i++) {
      const t = i / 400, u = 1 - t;
      const w = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
      pts.push([0, 1].map(k => w[0] * a[k] + w[1] * b[k] + w[2] * c[k] + w[3] * d[k]));
    }
  }
  let j = 0;
  return xs.map(x => {
    while (j < pts.length - 2 && pts[j + 1][0] < x) j++;
    const [xa, ya] = pts[j], [xb, yb] = pts[j + 1];
    const f = xb === xa ? 0 : Math.min(1, Math.max(0, (x - xa) / (xb - xa)));
    return BASE - (ya + (yb - ya) * f);
  });
})();

// The trough between the right end of the logo and its left end. It continues the
// slope of each end, so the line stays smooth while this part is in view.
const GAP = 140, PERIOD = WIDTH + GAP;
const STEP = WIDTH / (N - 1);
const END_SLOPE = (logo[N - 1] - logo[N - 2]) / STEP, START_SLOPE = (logo[1] - logo[0]) / STEP;
const gapHeight = g => GAP * g * (1 - g) * (END_SLOPE * (1 - g) - START_SLOPE * g);

const clamp01 = u => Math.min(1, Math.max(0, u));
// The speed and the acceleration are zero at the start and at the end, so the roll
// starts and stops gently.
const travelEase = u => u * u * u * (u * (6 * u - 15) + 10);

// The state of the line at time t: its shift, its sine quantity and the dip below the sun.
function lineAt(t) {
  const progress = travelEase(clamp01(t / TRAVEL_TIME));
  const tau = t - SUN_LAND;
  return {
    shift: -PERIOD * progress,
    sine: SINE_BLEND * Math.pow(Math.sin(Math.PI * progress), 2),
    dip: tau > 0 ? 14 * Math.exp(-8 * tau) * Math.sin(20 * tau) : 0,
    flick: FLICK_LIFT * flickPulse(t - SUN_LAUNCH),
  };
}

// The line below the sun dips a small quantity, then flicks up quickly when the sun
// leaves it, and goes back slowly. The result is from -0.3 to 1.
const FLICK_WIND = 0.16, FLICK_RISE = 0.07;
function flickPulse(tau) {
  if (!(tau > -FLICK_WIND)) return 0;
  if (tau < 0) return -0.3 * Math.pow(Math.sin(Math.PI * (tau + FLICK_WIND) / FLICK_WIND), 2);
  return tau / FLICK_RISE * Math.exp(1 - tau / FLICK_RISE);
}

function heightAt(x, state) {
  let pos = (x - X0 - state.shift) % PERIOD;
  if (pos < 0) pos += PERIOD;
  let shape;
  if (pos < WIDTH) {
    const f = pos / STEP, i = Math.min(N - 2, Math.floor(f));
    shape = logo[i] + (logo[i + 1] - logo[i]) * (f - i);
  } else {
    shape = gapHeight((pos - WIDTH) / GAP);
  }
  // Two sine cycles in a period, with one trough at the centre of the gap.
  const sine = SINE_HEIGHT * 0.5 * (1 - Math.cos(4 * Math.PI * (pos + GAP / 2) / PERIOD));
  const d = (x - 575) / 90;
  // The flick stays with the trough of the logo, where the sun was.
  const k = (x - SUN.x - state.shift) / 80;
  return shape + (sine - shape) * state.sine - state.dip * Math.exp(-d * d) + state.flick * Math.exp(-k * k);
}

function sunOnLine(t) {
  const state = lineAt(t), x = SUN.x + state.shift;
  return { x, y: BASE - heightAt(x, state) - SUN_ABOVE_LINE };
}

// The distance from the line to the centre of the sun, measured in the logo at rest.
let SUN_ABOVE_LINE;

function configure() {
  TRAVEL_TIME = parseFloat(control('travel').value);
  SUN_RIDE = parseFloat(control('ride').value);
  SUN_APEX_LIFT = parseFloat(control('lift').value);
  SINE_BLEND = parseFloat(control('sine').value);
  BOUNCE_LIFT = parseFloat(control('bounce').value);
  FLICK_LIFT = parseFloat(control('flick').value);
  SUN_LAUNCH = undefined;
  SUN_LAND = TRAVEL_TIME - 0.1;
  BOUNCE_END = SUN_LAND + 0.22;
  WORD_START = parseFloat(control('word').value);
  PAUSE = parseFloat(control('pause').value);
  WORD_END = WORD_START + LETTER_STAGGER * 5 + LETTER_TIME;
  // The logo is at rest 0.3 s after the bounce; the pause starts when the logo and the name are both at rest.
  AWAY_START = Math.max(BOUNCE_END + 0.3, WORD_END) + PAUSE;
  DURATION = AWAY_START + AWAY_TIME;
  SUN_ABOVE_LINE = BASE - SUN.y - heightAt(SUN.x, { shift: 0, sine: 0, dip: 0, flick: 0 });
  // The time when the trough has moved the sun through SUN_RIDE.
  let lo = 0, hi = TRAVEL_TIME;
  for (let k = 0; k < 40; k++) {
    const mid = (lo + hi) / 2;
    if (-lineAt(mid).shift < SUN_RIDE) lo = mid; else hi = mid;
  }
  SUN_LAUNCH = lo;
  FLIGHT_TIME = SUN_LAND - SUN_LAUNCH;
  LAUNCH = sunOnLine(SUN_LAUNCH);
  // The sun keeps its speed to the left when it leaves the trough, then turns back gradually.
  LAUNCH_SPEED = (lineAt(SUN_LAUNCH).shift - lineAt(SUN_LAUNCH - 0.001).shift) / 0.001 * FLIGHT_TIME;
  for (const out of document.querySelectorAll('#controls output')) out.value = control(out.htmlFor[0]).value;
  control('time').max = DURATION.toFixed(2);
}

function sunAt(t) {
  if (t <= SUN_LAUNCH) return sunOnLine(t);
  if (t < SUN_LAND) {
    const u = (t - SUN_LAUNCH) / FLIGHT_TIME, turn = u * u * (3 - 2 * u);
    return {
      x: LAUNCH.x + (SUN.x - LAUNCH.x) * turn + LAUNCH_SPEED * u * (1 - u) * (1 - u),
      y: LAUNCH.y + (SUN.y - LAUNCH.y) * u - 4 * SUN_APEX_LIFT * u * (1 - u),
    };
  }
  const u = clamp01((t - SUN_LAND) / (BOUNCE_END - SUN_LAND));
  return { x: SUN.x, y: SUN.y - 4 * BOUNCE_LIFT * u * (1 - u) };
}

const line = document.getElementById('line');
const clip = document.getElementById('clip');
const sun = document.getElementById('sun');
const letters = [...document.querySelectorAll('.letter')];
const stage = document.querySelector('svg');
// Each letter rises into place and goes a little past it before it settles.
const easeOutBack = u => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);

function render(t) {
  const state = lineAt(t);
  let d = '';
  for (let i = 0; i < N; i++) {
    d += (i ? 'L' : 'M') + xs[i].toFixed(1) + ' ' + (BASE - heightAt(xs[i], state)).toFixed(1);
  }
  line.setAttribute('d', d);
  // The clip continues level past the two ends of the line, so it does not cut the sun there.
  clip.setAttribute('d', d + `H3000V-2000H-2000V${(BASE - heightAt(X0, state)).toFixed(1)}Z`);
  const at = sunAt(t);
  sun.setAttribute('cx', at.x.toFixed(1));
  sun.setAttribute('cy', at.y.toFixed(1));
  letters.forEach((letter, i) => {
    const u = clamp01((t - WORD_START - LETTER_STAGGER * i) / LETTER_TIME);
    letter.setAttribute('opacity', clamp01(u * 2.5).toFixed(3));
    letter.setAttribute('transform', `translate(0 ${(LETTER_RISE * (1 - easeOutBack(u))).toFixed(2)})`);
  });
  // The whole overlay goes away: it fades and grows a little.
  const away = clamp01((t - AWAY_START) / AWAY_TIME), eased = away * away;
  stage.style.opacity = (1 - eased).toFixed(3);
  stage.style.transform = `scale(${(1 + 0.06 * eased).toFixed(4)})`;
}

// Playback. `time` is the time in the animation. The speed slider changes how fast
// `time` moves, and the step buttons move it by one frame of a 60 Hz display.
const FRAME = 1 / 60;
if (query.has('speed')) control('speed').value = query.get('speed');
let time = 0, playing = false, last = null, request = null;
// The sound of make-launch-sound.py. It agrees with the default values of the controls.
// A browser can refuse sound before the first click on the page, thus ignore that error.
// To hear an audition sound, give its path: ?sound=sound-design/wiggle-logo-playful.wav
const sound = new Audio(query.get('sound') || 'wiggle-logo-animation.wav');

function show() {
  render(time);
  control('time').value = time.toFixed(2);
  document.querySelector('output[for="time"]').value = time.toFixed(2);
  document.querySelector('output[for="speed"]').value = parseFloat(control('speed').value).toFixed(1);
  control('playback').textContent = playing ? 'Pause' : 'Play';
}
function frame(now) {
  if (last !== null) time += (now - last) / 1000 * parseFloat(control('speed').value);
  last = now;
  if (time < DURATION) {
    show();
    request = requestAnimationFrame(frame);
    return;
  }
  time = DURATION;
  stop();
  // The page shows the logo and the name at rest again after a moment, so it is not empty.
  setTimeout(() => { if (!playing && time === DURATION) render(AWAY_START); }, 700);
}
function stop() {
  if (request !== null) cancelAnimationFrame(request);
  request = null;
  playing = false;
  sound.pause();
  show();
}
function resume() {
  stop();
  if (time >= DURATION) time = 0;
  playing = true;
  last = null;
  show();
  sound.playbackRate = parseFloat(control('speed').value);
  sound.currentTime = time;
  sound.play().catch(() => {});
  request = requestAnimationFrame(frame);
}
function play() { configure(); time = 0; resume(); }
// Stop and go to a time. The time stays in the animation.
function seek(t) {
  time = Math.min(DURATION, Math.max(0, t));
  stop();
}

configure();
const fixed = query.get('t');
if (fixed !== null) {
  seek(parseFloat(fixed));
} else if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  seek(AWAY_START);
} else {
  play();
}
document.querySelector('svg').addEventListener('click', play);
control('replay').addEventListener('click', play);
control('controls').addEventListener('change', play);
control('controls').addEventListener('input', configure);
control('time').addEventListener('input', () => seek(parseFloat(control('time').value)));
control('speed').addEventListener('input', () => { sound.playbackRate = parseFloat(control('speed').value); show(); });
control('to-start').addEventListener('click', () => seek(0));
control('back').addEventListener('click', () => seek(time - FRAME));
control('playback').addEventListener('click', () => (playing ? stop() : resume()));
control('forward').addEventListener('click', () => seek(time + FRAME));
control('to-end').addEventListener('click', () => seek(DURATION));
</script>
</body>
</html>
