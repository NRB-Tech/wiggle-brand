<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiggle logo animation</title>
<style>
  :root { --bg: #FFFFFF; --line: #102D75; --sun: #F5A623; --hint: #6B7690; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1533; --line: #EAF0FF; --sun: #FFB743; --hint: #8E9AC0; }
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg { width: min(60vmin, 520px); height: auto; overflow: visible; cursor: pointer; }
  form { display: grid; grid-template-columns: auto minmax(120px, 260px) 3.5em; gap: 6px 12px; align-items: center;
         font: 14px -apple-system, system-ui, sans-serif; color: var(--hint); padding: 0 16px 16px; }
  form button { grid-column: 1 / -1; justify-self: center; font: inherit; padding: 6px 18px; margin-top: 6px; }
  output { font-variant-numeric: tabular-nums; }
  #line { fill: none; stroke: var(--line); stroke-width: 32; stroke-linecap: round; stroke-linejoin: round; }
  #sun { fill: var(--sun); }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" role="img" aria-label="Wiggle symbol">
  <defs><clipPath id="sun-clip"><path id="clip"/></clipPath></defs>
  <g clip-path="url(#sun-clip)"><circle id="sun" cx="554" cy="642" r="114"/></g>
  <path id="line"/>
</svg>
<form id="controls">
  <label for="travel">Roll time (s)</label><input id="travel" type="range" min="1" max="2.5" step="0.05" value="1.5"><output for="travel"></output>
  <label for="ride">Sun ride to the left</label><input id="ride" type="range" min="40" max="300" step="5" value="130"><output for="ride"></output>
  <label for="lift">Arc height</label><input id="lift" type="range" min="250" max="600" step="10" value="430"><output for="lift"></output>
  <label for="sine">Sine wave quantity</label><input id="sine" type="range" min="0" max="1" step="0.05" value="0.9"><output for="sine"></output>
  <label for="flick">Flick height</label><input id="flick" type="range" min="0" max="90" step="2" value="20"><output for="flick"></output>
  <label for="bounce">Bounce height</label><input id="bounce" type="range" min="0" max="60" step="2" value="26"><output for="bounce"></output>
  <button type="button" id="replay">Replay</button>
</form>
<script>
// Geometry of wiggle-symbol.svg: four cubic segments on the baseline y = 700.
const SEGMENTS = [
  [[154, 700], [210, 610], [270, 320], [370, 320]],
  [[370, 320], [470, 320], [475, 700], [585, 700]],
  [[585, 700], [675, 700], [705, 550], [760, 550]],
  [[760, 550], [815, 550], [835, 630], [870, 700]],
];
const X0 = 154, X1 = 870, WIDTH = X1 - X0, BASE = 700;
const SUN = { x: 554, y: 642, r: 114 };

// The first frame is the logo at rest, because a launch screen shows the static logo.
// The line then moves to the left through one full period, as a sine wave does, and
// what goes out at the left comes in at the right. A period is the logo and then a
// smooth trough that connects the right end of the logo to its left end, so the
// line has no sharp turn where the two ends meet. The trough of the logo moves the
// sun to the left with it. The large peak comes back in at the right and continues
// to roll. The sun pops up, goes over the large peak, and lands in the trough when
// the logo shape is back.
const query = new URLSearchParams(location.search);
// The controls on the page set these values. The defaults are the agreed motion.
const control = id => document.getElementById(id);
for (const id of ['travel', 'ride', 'lift', 'sine', 'flick', 'bounce']) {
  if (query.has(id)) control(id).value = query.get(id);
}
let TRAVEL_TIME;                            // the line moves through one full width
let SUN_RIDE;                               // how far the trough moves the sun before the sun leaves it
let SUN_LAND, BOUNCE_END, DURATION;
let SUN_APEX_LIFT, BOUNCE_LIFT;
let FLICK_LIFT;                             // how far the line lifts below the sun to flick it up
let SINE_BLEND;                             // how much the moving line becomes a sine wave
const SINE_HEIGHT = 265;
// Set by configure(): when and where the sun leaves the trough.
let SUN_LAUNCH, FLIGHT_TIME, LAUNCH, LAUNCH_SPEED;

// Sample the logo as a height above the baseline on N points. The two ends are on the
// baseline, so the shape can repeat.
const N = 257;
const xs = Array.from({ length: N }, (_, i) => X0 + WIDTH * i / (N - 1));
const logo = (() => {
  const pts = [];
  for (const [a, b, c, d] of SEGMENTS) {
    for (let i = 0; i <= 400; i++) {
      const t = i / 400, u = 1 - t;
      const w = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
      pts.push([0, 1].map(k => w[0] * a[k] + w[1] * b[k] + w[2] * c[k] + w[3] * d[k]));
    }
  }
  let j = 0;
  return xs.map(x => {
    while (j < pts.length - 2 && pts[j + 1][0] < x) j++;
    const [xa, ya] = pts[j], [xb, yb] = pts[j + 1];
    const f = xb === xa ? 0 : Math.min(1, Math.max(0, (x - xa) / (xb - xa)));
    return BASE - (ya + (yb - ya) * f);
  });
})();

// The trough between the right end of the logo and its left end. It continues the
// slope of each end, so the line stays smooth while this part is in view.
const GAP = 140, PERIOD = WIDTH + GAP;
const STEP = WIDTH / (N - 1);
const END_SLOPE = (logo[N - 1] - logo[N - 2]) / STEP, START_SLOPE = (logo[1] - logo[0]) / STEP;
const gapHeight = g => GAP * g * (1 - g) * (END_SLOPE * (1 - g) - START_SLOPE * g);

const clamp01 = u => Math.min(1, Math.max(0, u));
// The speed and the acceleration are zero at the start and at the end, so the roll
// starts and stops gently.
const travelEase = u => u * u * u * (u * (6 * u - 15) + 10);

// The state of the line at time t: its shift, its sine quantity and the dip below the sun.
function lineAt(t) {
  const progress = travelEase(clamp01(t / TRAVEL_TIME));
  const tau = t - SUN_LAND;
  return {
    shift: -PERIOD * progress,
    sine: SINE_BLEND * Math.pow(Math.sin(Math.PI * progress), 2),
    dip: tau > 0 ? 14 * Math.exp(-8 * tau) * Math.sin(20 * tau) : 0,
    flick: FLICK_LIFT * flickPulse(t - SUN_LAUNCH),
  };
}

// The line below the sun dips a small quantity, then flicks up quickly when the sun
// leaves it, and goes back slowly. The result is from -0.3 to 1.
const FLICK_WIND = 0.16, FLICK_RISE = 0.07;
function flickPulse(tau) {
  if (!(tau > -FLICK_WIND)) return 0;
  if (tau < 0) return -0.3 * Math.pow(Math.sin(Math.PI * (tau + FLICK_WIND) / FLICK_WIND), 2);
  return tau / FLICK_RISE * Math.exp(1 - tau / FLICK_RISE);
}

function heightAt(x, state) {
  let pos = (x - X0 - state.shift) % PERIOD;
  if (pos < 0) pos += PERIOD;
  let shape;
  if (pos < WIDTH) {
    const f = pos / STEP, i = Math.min(N - 2, Math.floor(f));
    shape = logo[i] + (logo[i + 1] - logo[i]) * (f - i);
  } else {
    shape = gapHeight((pos - WIDTH) / GAP);
  }
  // Two sine cycles in a period, with one trough at the centre of the gap.
  const sine = SINE_HEIGHT * 0.5 * (1 - Math.cos(4 * Math.PI * (pos + GAP / 2) / PERIOD));
  const d = (x - 575) / 90;
  // The flick stays with the trough of the logo, where the sun was.
  const k = (x - SUN.x - state.shift) / 80;
  return shape + (sine - shape) * state.sine - state.dip * Math.exp(-d * d) + state.flick * Math.exp(-k * k);
}

function sunOnLine(t) {
  const state = lineAt(t), x = SUN.x + state.shift;
  return { x, y: BASE - heightAt(x, state) - SUN_ABOVE_LINE };
}

// The distance from the line to the centre of the sun, measured in the logo at rest.
let SUN_ABOVE_LINE;

function configure() {
  TRAVEL_TIME = parseFloat(control('travel').value);
  SUN_RIDE = parseFloat(control('ride').value);
  SUN_APEX_LIFT = parseFloat(control('lift').value);
  SINE_BLEND = parseFloat(control('sine').value);
  BOUNCE_LIFT = parseFloat(control('bounce').value);
  FLICK_LIFT = parseFloat(control('flick').value);
  SUN_LAUNCH = undefined;
  SUN_LAND = TRAVEL_TIME - 0.1;
  BOUNCE_END = SUN_LAND + 0.22;
  DURATION = BOUNCE_END + 0.3;
  SUN_ABOVE_LINE = BASE - SUN.y - heightAt(SUN.x, { shift: 0, sine: 0, dip: 0, flick: 0 });
  // The time when the trough has moved the sun through SUN_RIDE.
  let lo = 0, hi = TRAVEL_TIME;
  for (let k = 0; k < 40; k++) {
    const mid = (lo + hi) / 2;
    if (-lineAt(mid).shift < SUN_RIDE) lo = mid; else hi = mid;
  }
  SUN_LAUNCH = lo;
  FLIGHT_TIME = SUN_LAND - SUN_LAUNCH;
  LAUNCH = sunOnLine(SUN_LAUNCH);
  // The sun keeps its speed to the left when it leaves the trough, then turns back gradually.
  LAUNCH_SPEED = (lineAt(SUN_LAUNCH).shift - lineAt(SUN_LAUNCH - 0.001).shift) / 0.001 * FLIGHT_TIME;
  for (const out of document.querySelectorAll('output')) out.value = control(out.htmlFor[0]).value;
}

function sunAt(t) {
  if (t <= SUN_LAUNCH) return sunOnLine(t);
  if (t < SUN_LAND) {
    const u = (t - SUN_LAUNCH) / FLIGHT_TIME, turn = u * u * (3 - 2 * u);
    return {
      x: LAUNCH.x + (SUN.x - LAUNCH.x) * turn + LAUNCH_SPEED * u * (1 - u) * (1 - u),
      y: LAUNCH.y + (SUN.y - LAUNCH.y) * u - 4 * SUN_APEX_LIFT * u * (1 - u),
    };
  }
  const u = clamp01((t - SUN_LAND) / (BOUNCE_END - SUN_LAND));
  return { x: SUN.x, y: SUN.y - 4 * BOUNCE_LIFT * u * (1 - u) };
}

const line = document.getElementById('line');
const clip = document.getElementById('clip');
const sun = document.getElementById('sun');

function render(t) {
  const state = lineAt(t);
  let d = '';
  for (let i = 0; i < N; i++) {
    d += (i ? 'L' : 'M') + xs[i].toFixed(1) + ' ' + (BASE - heightAt(xs[i], state)).toFixed(1);
  }
  line.setAttribute('d', d);
  // The clip continues level past the two ends of the line, so it does not cut the sun there.
  clip.setAttribute('d', d + `H3000V-2000H-2000V${(BASE - heightAt(X0, state)).toFixed(1)}Z`);
  const at = sunAt(t);
  sun.setAttribute('cx', at.x.toFixed(1));
  sun.setAttribute('cy', at.y.toFixed(1));
}

const fixed = query.get('t');
let start = null;
function frame(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000;
  render(Math.min(t, DURATION));
  if (t < DURATION) requestAnimationFrame(frame);
}
function play() { configure(); start = null; requestAnimationFrame(frame); }

configure();
if (fixed !== null) {
  render(parseFloat(fixed));
} else if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  render(DURATION);
} else {
  play();
}
document.querySelector('svg').addEventListener('click', play);
control('replay').addEventListener('click', play);
control('controls').addEventListener('change', play);
control('controls').addEventListener('input', configure);
</script>
</body>
</html>
