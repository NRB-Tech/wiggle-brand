<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <clipPath id="sun-above-wave">
      <path d="M-112 28.5 C-41.985 28.5 -17.76 162.5 93.39 162.5 S228.765 28.5 298.78 28.5 C368.795 28.5 393.02 162.5 504.17 162.5 S639.545 28.5 709.56 28.5 C779.575 28.5 803.8 162.5 914.95 162.5 S1050.325 28.5 1120.34 28.5 C1190.355 28.5 1214.58 162.5 1325.73 162.5 L1325.73 0 L-112 0 Z"/>
    </clipPath>
  </defs>

  <rect width="1584" height="396" fill="#F7F9FD"/>

  <!-- The company banner's wave and sun, for a personal LinkedIn profile.
       LinkedIn puts the profile photo over the lower-left corner (about
       x 45-365, y 195 down), so the sun sits in the trough to its right.
       The wave ends at the next crest, which leaves the right side clear
       for the tag line, as in the Gravatar banner. -->
  <g transform="translate(-206 20) scale(1.6)">
    <g clip-path="url(#sun-above-wave)">
      <circle cx="504.17" cy="139.9" r="70.3" fill="#F5A623"/>
    </g>
    <path d="M-112 28.5 C-41.985 28.5 -17.76 162.5 93.39 162.5 S228.765 28.5 298.78 28.5 C368.795 28.5 393.02 162.5 504.17 162.5 S639.545 28.5 709.56 28.5"
          fill="none" stroke="#102D75" stroke-linecap="round" stroke-width="22"/>
  </g>

  <text x="1504" y="214" fill="#102D75" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700">Home energy, on your terms.</text>
  <text x="1504" y="262" fill="#40557F" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="500">Your car, heating and battery, working together.</text>
  <text x="1504" y="314" fill="#102D75" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700">wiggle.energy</text>
</svg>
